    <style amp-custom>
        :root {
            --rose-bg: #1a0007;
            --rose-dark: #80001a;
            --rose-main: #cc0000;
            --rose-bright: #ff0000;
            --rose-glow: #ff2a2a;
            --rose-light: #ffb3b3;
        }

        body {
            background: var(--rose-bg);
            color: #fff;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at center, #5a0016 0%, #1a0007 100%);
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrap {

            animation: pulseGlow 1.8s infinite ease-in-out;
        }

        .welcome { text-align: center; margin-bottom: 15px; }
        .welcome h1 {
            font-size: 11px;
            color: var(--rose-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 0 0 8px var(--rose-bright);
        }

        .hologram-frame {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin-bottom: 25px;
            border: 2px solid #ffffff;
            background: var(--rose-dark);
            padding: 0px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 18px var(--rose-bright), inset 0 0 12px var(--rose-glow);
            animation: borderPulse 1.5s infinite ease-in-out;
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: #ffffff;
            box-shadow: 0 0 12px var(--rose-glow);
            z-index: 10;
            animation: scan 2.5s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(380px); opacity: 0; }
        }

        /* --- TOMBOL DENGAN SKEMA MERAH SESUAI GAMBAR LOGO --- */
        .main-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 0;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            color: #ffffff;
            text-transform: uppercase;
            border-radius: 10px;
            border: 2px solid #ffffff;
            background: linear-gradient(180deg, var(--rose-bright) 0%, var(--rose-dark) 100%);
            box-shadow: 0 0 15px var(--rose-bright), inset 0 0 8px rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            animation: btnGlow 1.2s infinite alternate ease-in-out;
        }

        .btn-livechat {
            width: 100%;
            margin-bottom: 20px;
        }

        /* Efek Kilatan Cahaya Cepat Pada Tombol */
        .btn-main::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.95) 50%,
                transparent 100%
            );
            transform: skewX(-25deg);
            animation: fastSweep 1.2s infinite linear;
        }

        @keyframes fastSweep {
            0% { left: -150%; }
            100% { left: 200%; }
        }

        .icon-main { 
            width: 18px; 
            height: 18px; 
            fill: #ffffff; 
            filter: drop-shadow(0 0 3px #ffffff); 
            position: relative;
            z-index: 2;
        }

        .running-text {
            width: 100%;
            background: rgba(30, 0, 8, 0.85);
            border: 1px solid var(--rose-bright);
            padding: 8px 5px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 12px var(--rose-bright);
            text-shadow: 0 0 5px var(--rose-glow);
            animation: cyber-glitch 0.2s infinite, textPulse 1.5s infinite alternate;
        }

        @keyframes cyber-glitch {
            0% { transform: translate(0); text-shadow: 2px 0 var(--rose-bright); }
            5% { transform: translate(-2px, 1px); text-shadow: -2px 0 var(--rose-glow); }
            10% { transform: translate(2px, -1px); clip-path: inset(10% 0 30% 0); }
            15% { transform: translate(-1px, 2px); clip-path: inset(40% 0 10% 0); }
            20% { transform: translate(0); clip-path: none; text-shadow: 2px 0 var(--rose-bright); }
            100% { transform: translate(0); }
        }

        .running-text::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255, 0, 0, 0.15) 0px, rgba(255, 0, 0, 0.15) 1px, transparent 2px);
            pointer-events: none;
        }

        /* --- TEKS DENGAN ANIMASI KILAT CEPAT --- */
        .retro-text {
            position: relative;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2.5px;
            background: linear-gradient(
                90deg,
                var(--rose-light) 0%,
                #ffffff 20%,
                var(--rose-bright) 35%,
                #ffffff 50%,
                var(--rose-bright) 65%,
                #ffffff 80%,
                var(--rose-light) 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: lightningSweep 0.8s linear infinite;
            filter: drop-shadow(0 0 10px var(--rose-bright));
        }

        @keyframes lightningSweep {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes borderPulse {
            0% { box-shadow: 0 0 8px var(--rose-bright); border-color: var(--rose-main); }
            50% { box-shadow: 0 0 22px var(--rose-glow), 0 0 35px var(--rose-bright); border-color: #ffffff; }
            100% { box-shadow: 0 0 8px var(--rose-bright); border-color: var(--rose-main); }
        }

        @keyframes btnGlow {
            0% { box-shadow: 0 0 8px var(--rose-main), inset 0 0 4px rgba(255, 255, 255, 0.3); }
            100% { box-shadow: 0 0 22px var(--rose-glow), 0 0 32px var(--rose-bright), inset 0 0 12px rgba(255, 255, 255, 0.7); }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 6px var(--rose-bright)); }
            50% { filter: drop-shadow(0 0 18px var(--rose-glow)); }
        }

        @keyframes textPulse {
            0% { color: #ffffff; }
            100% { color: var(--rose-light); }
        }
