<style amp-custom> :root {
  --bg: #867920;
  --text: #f0f8ff;

  --neon-blue-light: #ffb94d;
  --neon-pulse: #a48421;

* {

}

html,
body {

}

body {
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px;
  background: radial-gradient(ellipse at 20% 50%, rgba(207, 135, 27, 0.25), transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(0, 100, 200, 0.15), transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(77, 184, 255, 0.08), transparent 50%),
              linear-gradient(180deg, #867920 0%, #867920 40%, #002244 70%, #867920 100%)
}

.shell {
  max-width: 520px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px
}

.header {
  display: flex;
  justify-content: center;
  margin-bottom: 0
}

.logo {
  border-radius: 8px;
  filter: drop-shadow(0 0 20px rgba(0, 136, 255, 0.5))
}

.marquee-wrapper {
  width: 100%;
  background: #867920;
  border-top: 2px groove #ffb94d;
  border-bottom: 2px groove #ffb94d;
  overflow: hidden;
  padding: 8px 0;
  box-shadow: 0 0 20px rgba(207, 135, 27, 0.25)
}

.marquee-text {
  display: inline-block;
  white-space: nowrap;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  padding-left: 100%;
  animation: marquee 12s linear infinite;
  text-shadow: 0 0 10px rgba(0, 136, 255, 0.4)
}

@keyframes marquee {
  0% { transform: translateX(0) }
  100% { transform: translateX(-100%) }
}

.card {
  position: relative;
  background: linear-gradient(180deg, rgba(0, 136, 255, 0.06), rgba(0, 50, 100, 0.04));
  border: 3px solid #ffb94d;
  border-radius: 18px;
  box-shadow: 0 0 30px rgba(0, 136, 255, 0.25), inset 0 0 12px rgba(207, 135, 27, 0.25), 0 10px 50px rgba(0, 0, 0, 0.6);
  overflow: hidden;
  width: 100%;
  padding: 20px;
  transition: all 0.3s ease
}

.card:hover {
  box-shadow: 0 0 50px rgba(0, 136, 255, 0.4), inset 0 0 20px rgba(0, 136, 255, 0.2), 0 10px 60px rgba(0, 0, 0, 0.7);
  transform: scale(1.01)
}

.card::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(0, 136, 255, 0.10), transparent 70%);
  animation: neonWave 6s linear infinite;
  filter: blur(25px);
  z-index: 0
}

@keyframes neonWave {
  0% { transform: translateX(-50%) translateY(-50%) rotate(0deg) }
  100% { transform: translateX(-50%) translateY(-50%) rotate(360deg) }
}

.hero {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  position: relative;
  z-index: 1
}

.hero-img {
  border-radius: 14px;
  width: 100%;
  height: auto;
  border: 2px solid rgba(0, 136, 255, 0.2);
  box-shadow: 0 0 30px rgba(207, 135, 27, 0.25)
}

.cta {
  display: flex;
  gap: 12px;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
  position: relative;
  z-index: 1
}

.btn {
  flex: 1 1 45%;
  display: inline-block;
  text-decoration: none;
  text-align: center;
  padding: 14px 16px;
  border-radius: 12px;
  font-weight: 700;
  letter-spacing: .3px;
  border: 2px solid transparent;
  transition: all .25s ease;
  position: relative;
  overflow: hidden;
  color: #fff;
  background: #867920;
  z-index: 1;
  text-shadow: 0 0 10px rgba(0, 136, 255, 0.3)
}

.btn::before {
  content: "";
  position: absolute;
  top: -3px;
  left: -3px;
  right: -3px;
  bottom: -3px;
  background: conic-gradient(from 0deg, #ffb94d, #ffb94d, #a48421, #ffb94d);
  border-radius: 14px;
  z-index: -1;
  filter: blur(8px);
  animation: rotateBorder 2.5s linear infinite
}

.btn::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  right: 3px;
  bottom: 3px;
  background: linear-gradient(180deg, #867920, #867920);
  border-radius: 10px;
  z-index: -1
}

.btn:hover {
  animation: glowPulse 1s infinite;
  transform: translateY(-2px)
}

@keyframes rotateBorder {
  to { transform: rotate(360deg) }
}

@keyframes glowPulse {
  0% { box-shadow: 0 0 30px rgba(0, 136, 255, 0.4), 0 0 60px rgba(77, 184, 255, 0.15) }
  50% { box-shadow: 0 0 60px rgba(0, 136, 255, 0.7), 0 0 120px rgba(0, 100, 200, 0.3) }
  100% { box-shadow: 0 0 30px rgba(0, 136, 255, 0.4), 0 0 60px rgba(77, 184, 255, 0.15) }
}

.section-buttons {

.badge-container {

.badge::before {

.badge::after {

  right: 3px;
  bottom: 3px;
  background: linear-gradient(180deg, #867920, #867920);

.badge:hover {
